# ═══════════════════════════════════════════════════════════════════════════════
# Autonomous Data Scientist Pipeline — Default Configuration
# ═══════════════════════════════════════════════════════════════════════════════
# All values here can be overridden by environment variables prefixed with the
# section name (e.g. PIPELINE_RANDOM_SEED=123).

pipeline:
  random_seed: 42
  max_retries: 3
  checkpoint_enabled: true
  artifact_dir: "artifacts"
  report_dir: "reports"
  data_dir: "data"
  log_dir: "logs"

llm:
  model: "cerebras/llama3.1-8b"
  temperature: 0.1
  max_tokens: 4096

data_collection:
  chunk_size: 50000
  max_columns: 500
  sample_rows_for_profiling: 10000

preprocessing:
  # Outlier winsorization off by default: tree/boosting models dominate and are
  # robust to outliers, and clipping erases predictive high-leverage tail values.
  # Set to "iqr" to re-enable. (See PreprocessingConfig for the full rationale.)
  outlier_method: "none"
  iqr_multiplier: 1.5
  max_null_threshold: 0.70
  max_cardinality: 50
  duplicate_keep: "first"

feature_engineering:
  max_onehot_cardinality: 15
  variance_threshold: 0.01
  correlation_threshold: 0.95
  # Keep up to 100 features by mutual information. The cut only bites on wide
  # datasets; a low cap (was 30) silently discarded useful mid-ranked features.
  select_k_best: 100
  # No global scaling of the shared matrix — scale-sensitive models are wrapped in
  # a per-fit StandardScaler at training time instead (leakage-free; trees keep
  # raw features). Set to standard/minmax/robust to scale the shared matrix.
  scaling_method: "none"

splitting:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

training:
  n_jobs: -1
  cv_folds: 5
  timeout_per_model_seconds: 300

error_detection:
  min_classification_f1: 0.30
  min_regression_r2: 0.10
  overfitting_threshold: 0.15
  max_feature_count: 500

improvement:
  tuning_iterations: 15   # per-round search budget (was 50 — minutes of fruitless CPU)
  early_stopping_rounds: 10
  use_optuna: false

logging:
  level: "INFO"
  max_bytes: 10485760   # 10 MB
  backup_count: 5
  json_format: true
